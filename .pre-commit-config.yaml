repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "c0f278f1254ccc8fb09676bcdb8d847e7db493e5"  # frozen: v0.17.4
  hooks:
  - id: ruff
    args: [--fix, --show-fixes]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: "ad26ebfa797fcb9b8f83275937c1c1d6e126719c"  # frozen: v2.4.1
  hooks:
    - id: mypy
      files: src
      args: []

- repo: https://github.com/abravalheri/validate-pyproject
  rev: "82d21874c3242e4dc27bb47641c996902ef64eef"  # frozen: v0.27
  hooks:
    - id: validate-pyproject
      additional_dependencies: ["validate-pyproject-schema-store[all]>=2024.10.21"]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: "39478bf2c099a58683d3f1aedf675105318b078d"  # frozen: 0.39.0
  hooks:
    - id: check-dependabot
    - id: check-github-workflows
    - id: check-readthedocs

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
  hooks:
  - id: zizmor
    files: "^\\.github"
