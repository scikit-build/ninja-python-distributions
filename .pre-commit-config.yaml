repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "f12be1ebaa5351c1fc76472de98db2c3446c8253"  # frozen: v0.16.10
  hooks:
  - id: ruff
    args: [--fix, --show-fixes]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: "2834ec6639549dd6796205c8f011dedcd587288b"  # frozen: v2.4.0
  hooks:
    - id: mypy
      files: src
      args: []

- repo: https://github.com/abravalheri/validate-pyproject
  rev: "17e12779811926f000bdfa1795f9e3735dd71ac3"  # frozen: 0.26
  hooks:
    - id: validate-pyproject
      additional_dependencies: ["validate-pyproject-schema-store[all]>=2024.10.21"]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: "4f85d46a92dc17713078e5de73f8a13190edf6fc"  # frozen: 0.38.2
  hooks:
    - id: check-dependabot
    - id: check-github-workflows
    - id: check-readthedocs

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
  - id: zizmor
    files: "^\\.github"
